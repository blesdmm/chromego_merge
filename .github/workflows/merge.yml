name: Merge Script

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: '0 0/6 * * *'  # 每 6h 一次
  workflow_dispatch:  # 触发手动事件

jobs:
  merge:
    runs-on: ubuntu-latest

    # 显式赋予仓库读写权限，解决 git push 报错问题
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 升级到 v4

      - name: Set up Python
        uses: actions/setup-python@v5  # 升级到最新版
        with:
          python-version: '3.11'  

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run merge script
        run: python meta_merge.py 

      - name: Run shadowrocket merge script
        run: python merge.py  

      - name: Run sing-box script
        run: python sing-box.py  

      - name: Commit Changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected in the repository."
            git config core.ignorecase false
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "Updated at $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes detected in the repository."
          fi
